# .github/workflows/ci.yml
# ------------------------------------------------------------------------------
# @description GitHub Actions workflow for Continuous Integration (CI).
# This pipeline automatically triggers on pushes and pull requests to the main 
# branch, ensuring that code quality (linting) and business logic (testing) 
# remain intact before any merge operations.
# ------------------------------------------------------------------------------

name: CodeForge CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gates:
    name: CodeForge Quality Gates
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies (Backend)
        run: npm ci
        working-directory: ./backend

      - name: Install dependencies (Frontend)
        run: npm ci
        working-directory: ./frontend

      - name: Lint (Backend)
        run: npm run lint
        working-directory: ./backend

      - name: Lint (Frontend)
        run: npm run lint
        working-directory: ./frontend

      - name: Typecheck (Backend)
        run: npm run typecheck
        working-directory: ./backend

      - name: Typecheck (Frontend)
        run: npm run typecheck
        working-directory: ./frontend

      - name: Unit / Integration Tests (Backend)
        env:
          NODE_ENV: test
          MONGODB_URI: 'mongodb://localhost:27017/codeforge_test'
          JWT_SECRET: 'testsecret123'
          ADMIN_API_KEY: 'test-admin-api-key'
        run: npm run test:cov
        working-directory: ./backend

      - name: Build (Backend)
        run: npm run build
        working-directory: ./backend

      - name: Build (Frontend)
        run: npm run build
        working-directory: ./frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./frontend

      - name: E2E Tests (Playwright)
        env:
          NODE_ENV: test
          MONGODB_URI: 'mongodb://localhost:27017/codeforge_test'
          JWT_SECRET: 'testsecret123'
          ADMIN_API_KEY: 'test-admin-api-key'
        run: npx playwright test
        working-directory: ./frontend

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Security Audit (Backend)
        run: npm audit
        working-directory: ./backend

      - name: Security Audit (Frontend)
        run: npm audit
        working-directory: ./frontend