# .github/workflows/ci.yml
# ------------------------------------------------------------------------------
# @description GitHub Actions workflow for Continuous Integration (CI).
# This pipeline automatically triggers on pushes and pull requests to the main 
# branch, ensuring that code quality (linting) and business logic (testing) 
# remain intact before any merge operations.
# ------------------------------------------------------------------------------

name: CodeForge CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    
    # Specify the working directory since the project is a monorepo
    defaults:
      run:
        working-directory: ./backend

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    strategy:
      matrix:
        # Test against the current Maintenance LTS Node versions
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Enable caching for faster workflow execution
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        # 'npm ci' is used in automated environments for strict, clean installs
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Backend
        run: npm run build

      - name: Execute Vitest Suite
        env:
          NODE_ENV: test
          MONGODB_URI: 'mongodb://localhost:27017/codeforge_test'
          JWT_SECRET: 'testsecret123'
          ADMIN_API_KEY: 'test-admin-api-key'
        run: npm run test:cov

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          
      - name: Backend Security Audit
        run: npm audit

  frontend-checks:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test Build (Astro)
        run: npm run build
        
      - name: Frontend Security Audit
        run: npm audit

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test